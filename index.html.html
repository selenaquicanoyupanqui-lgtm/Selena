<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner QR Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-top: 0;
            color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 15px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-stop {
            background-color: #ef4444;
        }
        .btn-stop:hover {
            background-color: #dc2626;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important; /* Quita el borde por defecto de la librería */
        }

        /* Estilizar elementos internos de la librería que no podemos evitar que cree */
        #reader video {
            border-radius: 8px;
            object-fit: cover;
        }

        .history-section {
            margin-top: 25px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .history-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .clear-btn {
            background: none;
            border: none;
            color: #st;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--bg);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .history-date {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 4px;
            display: block;
        }

        .placeholder-text {
            text-align: center;
            color: #9ca3af;
            font-style: italic;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Escáner de Códigos QR</h1>
    
    <button id="btn-toggle" class="btn">Activar Cámara</button>
    
    <div id="reader" style="display: none;"></div>

    <div class="history-section">
        <div class="history-header">
            <span class="history-title">Lecturas Recientes</span>
            <button id="btn-clear" class="clear-btn" style="display: none;">Limpiar</button>
        </div>
        <ul id="history-list" class="history-list">
            </ul>
        <p id="placeholder" class="placeholder-text">No hay lecturas registradas todavía.</p>
    </div>
</div>

<script>
    const btnToggle = document.getElementById('btn-toggle');
    const btnClear = document.getElementById('btn-clear');
    const readerDiv = document.getElementById('reader');
    const historyList = document.getElementById('history-list');
    const placeholder = document.getElementById('placeholder');

    let html5QrCode = null;
    let isScanning = false;

    // Al cargar la página, mostramos el historial guardado en el dispositivo
    document.addEventListener('DOMContentLoaded', loadHistory);

    btnToggle.addEventListener('click', () => {
        if (!isScanning) {
            startScanner();
        } else {
            stopScanner();
        }
    });

    btnClear.addEventListener('click', () => {
        if(confirm("¿Seguro que quieres borrar todo el historial?")) {
            localStorage.removeItem('qr_history');
            renderHistory([]);
        }
    });

    function startScanner() {
        readerDiv.style.display = 'block';
        html5QrCode = new Html5Qrcode("reader");
        
        // Configuración para móviles: 'environment' prioriza la cámara trasera
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start(
            { facingMode: "environment" }, 
            config,
            onScanSuccess
        ).then(() => {
            isScanning = true;
            btnToggle.textContent = "Detener Cámara";
            btnToggle.classList.add('btn-stop');
        }).catch((err) => {
            console.error("Error al iniciar la cámara: ", err);
            alert("No se pudo acceder a la cámara. Asegúrate de dar los permisos correspondientes.");
            readerDiv.style.display = 'none';
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                readerDiv.style.style.display = 'none';
                isScanning = false;
                btnToggle.textContent = "Activar Cámara";
                btnToggle.classList.remove('btn-stop');
            }).catch((err) => console.error("Error al detener la cámara: ", err));
        }
    }

    function onScanSuccess(decodedText, decodedResult) {
        // Detenemos la cámara momentáneamente al encontrar un código para evitar lecturas duplicadas masivas
        stopScanner();
        
        // Sonido sutil de éxito (opcional, generado por la API de audio del navegador)
        beep();

        // Guardar en el historial
        saveResult(decodedText);
    }

    function saveResult(text) {
        const history = JSON.parse(localStorage.getItem('qr_history')) || [];
        
        const newRecord = {
            id: Date.now(),
            data: text,
            date: new Date().toLocaleString() // Guarda fecha y hora local formateada
        };

        // Insertamos al principio para que lo más nuevo salga arriba
        history.unshift(newRecord);
        localStorage.setItem('qr_history', JSON.stringify(history));
        
        renderHistory(history);
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('qr_history')) || [];
        renderHistory(history);
    }

    function renderHistory(history) {
        historyList.innerHTML = '';
        
        if (history.length === 0) {
            placeholder.style.display = 'block';
            btnClear.style.display = 'none';
            return;
        }

        placeholder.style.display = 'none';
        btnClear.style.display = 'inline-block';

        history.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            
            // Si el texto es un enlace, lo hacemos clickeable de forma segura
            if(item.data.startsWith('http://') || item.data.startsWith('https://')) {
                li.innerHTML = `<a href="${item.data}" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 500;">${item.data}</a>`;
            } else {
                li.textContent = item.data;
            }

            const spanDate = document.createElement('span');
            spanDate.className = 'history-date';
            spanDate.textContent = item.date;
            
            li.appendChild(spanDate);
            historyList.appendChild(li);
        });
    }

    // Función auxiliar para un pitido rápido de confirmación
    function beep() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    }
</script>
</body>
</html>
